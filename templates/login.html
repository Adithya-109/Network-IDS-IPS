<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - NIDS</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main_theme.css') }}?v=3">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    }
  </script>
</head>
<body>

  <header class="site-header">
    <div class="nav-pill">
      <a href="/">Home</a>
      <a href="/login" style="color: var(--acm-accent)">Sign In</a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle Theme">
        <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </header>

  <div class="login-container">
    <div class="login-card" style="animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);">
      <h2>AUTHENTICATION</h2>
      
      {% if error %}
      <div style="background: rgba(249, 95, 74, 0.1); border: 1px solid var(--acm-accent); color: var(--acm-accent); padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; text-align: center; animation: slideUp 0.3s ease;">
        {{ error }}
      </div>
      {% endif %}

      <form action="/login" method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="off" placeholder="Enter username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn-acm" style="width: 100%; justify-content: center; margin-top: 10px;">
          VERIFY &amp; ENTER
        </button>
      </form>
    </div>
  </div>

  <style>
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

</body>
</html>
